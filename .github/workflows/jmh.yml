name: jmh-smoke

# Smoke test only: proves each battle compiles and runs on a clean box, and lets
# anyone reproduce with one click. Shared CI runners are too noisy for publishable
# microbenchmark numbers, which come from a disclosed local box (see README).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
      - name: Build object-mapping JMH jar
        run: ./gradlew :object-mapping:jmhJar --no-daemon
      - name: Smoke-run (1 fork, minimal iterations)
        run: |
          java -jar object-mapping/build/libs/object-mapping-*-jmh.jar \
            -f 1 -wi 1 -i 2 -w 1s -r 1s \
            -rf json -rff object-mapping/build/results/jmh/smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: jmh-smoke-results
          path: object-mapping/build/results/jmh/smoke.json
          if-no-files-found: warn
